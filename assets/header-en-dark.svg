<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img">
  <title>Pedro Henrique Gonçalves — Learning Journey in Full-Stack &amp; Agentic AI (Dark)</title>
  <defs>
    <clipPath id="card-clip-en-dark">
      <rect x="0.5" y="0.5" width="839" height="199" rx="12" />
    </clipPath>
    <clipPath id="typing-clip-en-dark">
      <rect x="60" y="112" width="560" height="32" />
    </clipPath>
    <radialGradient id="corner-glow-en-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      .dot-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: dot-pulse 2.6s ease-in-out infinite;
      }
      .typing-cursor {
        animation: blink 0.9s steps(2, start) infinite;
      }
      .typing-curtain {
        animation: typing-sweep 5s infinite;
      }
      .line-1 {
        opacity: 1;
        animation: show-1 15s steps(1, end) infinite;
      }
      .line-2 {
        opacity: 0;
        animation: show-2 15s steps(1, end) infinite;
      }
      .line-3 {
        opacity: 0;
        animation: show-3 15s steps(1, end) infinite;
      }
      @keyframes dot-pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.82);
        }
      }
      @keyframes blink {
        0%, 49% {
          opacity: 1;
        }
        50%, 100% {
          opacity: 0;
        }
      }
      @keyframes typing-sweep {
        0%, 8% {
          transform: translateX(0px);
          animation-timing-function: steps(44, end);
        }
        44%, 76% {
          transform: translateX(410px);
          animation-timing-function: steps(44, end);
        }
        94%, 100% {
          transform: translateX(0px);
        }
      }
      @keyframes show-1 {
        0% { opacity: 1; }
        33.333% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes show-2 {
        0% { opacity: 0; }
        33.333% { opacity: 1; }
        66.666% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes show-3 {
        0% { opacity: 0; }
        66.666% { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot-pulse { animation: none; }
        .typing-cursor { animation: none; display: none; }
        .typing-curtain { animation: none; display: none; }
        .line-1 { opacity: 1; animation: none; }
        .line-2, .line-3 { opacity: 0; animation: none; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="199" rx="12" fill="#0D1117" stroke="#21262D" stroke-width="1" />

  <g clip-path="url(#card-clip-en-dark)">
    <circle cx="770" cy="36" r="130" fill="url(#corner-glow-en-dark)" />
    <g fill="#21262D" opacity="0.9">
      <circle cx="748" cy="30" r="1.5" />
      <circle cx="764" cy="30" r="1.5" />
      <circle cx="780" cy="30" r="1.5" />
      <circle cx="796" cy="30" r="1.5" />
      <circle cx="748" cy="46" r="1.5" />
      <circle cx="764" cy="46" r="1.5" />
      <circle cx="780" cy="46" r="1.5" />
      <circle cx="796" cy="46" r="1.5" />
      <circle cx="764" cy="62" r="1.5" />
      <circle cx="780" cy="62" r="1.5" />
      <circle cx="796" cy="62" r="1.5" />
    </g>
  </g>

  <rect x="24" y="28" width="3" height="144" rx="1.5" fill="#6366F1" />

  <circle class="dot-pulse" cx="48" cy="44" r="3.5" fill="#6366F1" />
  <text x="60" y="48" class="sans" font-size="11" font-weight="600" letter-spacing="1.4" fill="#818CF8">LEARNING JOURNEY · FULL-STACK &amp; AGENTIC AI</text>

  <text x="44" y="96" class="sans" font-size="30" font-weight="700" letter-spacing="-0.4" fill="#F0F6FC">Pedro Henrique Gonçalves</text>

  <text x="44" y="134" class="mono" font-size="14.5" font-weight="600" fill="#6366F1">&gt;</text>

  <g clip-path="url(#typing-clip-en-dark)">
    <text x="62" y="134" class="mono line-1" font-size="14.5" fill="#E6EDF3">Building real web apps with JS and Node.js.</text>
    <text x="62" y="134" class="mono line-2" font-size="14.5" fill="#E6EDF3">Leveling up in React and modern interfaces.</text>
    <text x="62" y="134" class="mono line-3" font-size="14.5" fill="#E6EDF3">Exploring Agentic AI, workflows and tools.</text>
    <g class="typing-curtain">
      <rect x="60" y="114" width="560" height="28" fill="#0D1117" />
      <rect class="typing-cursor" x="60" y="117" width="2.5" height="20" rx="1" fill="#6366F1" />
    </g>
  </g>

  <text x="44" y="168" class="sans" font-size="12" fill="#8B949E">Brazil · @P3dro236 · Building real projects and documenting every step</text>
</svg>
