<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img">
  <title>Learning Journey — Core in JS and Node.js, Evolving in React, Java Project and Current Focus in Agentic AI (Light)</title>
  <defs>
    <linearGradient id="flow-grad-en-light" gradientUnits="userSpaceOnUse" x1="105" y1="78" x2="735" y2="78">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0" />
      <stop offset="12%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="88%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </linearGradient>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      .flow-line {
        animation: flow 4.5s linear infinite;
      }
      .pulse-ring {
        transform-origin: 735px 78px;
        animation: pulse-ring 2.6s ease-out infinite;
      }
      @keyframes flow {
        0% {
          stroke-dashoffset: 90;
        }
        100% {
          stroke-dashoffset: -720;
        }
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.7;
        }
        75%, 100% {
          transform: scale(1.75);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line {
          animation: none;
          display: none;
        }
        .pulse-ring {
          animation: none;
          opacity: 0.35;
          transform: scale(1.1);
        }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="219" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

