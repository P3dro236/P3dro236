<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img">
  <title>Trilha de Estudos — Base em JS e Node.js, Evolução em React, Projeto em Java e Foco Atual em IA Agêntica (Dark)</title>
  <defs>
    <linearGradient id="flow-grad-pt-dark" gradientUnits="userSpaceOnUse" x1="105" y1="78" x2="735" y2="78">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="12%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="88%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      .flow-line {
        animation: flow 4.5s linear infinite;
      }
      .pulse-ring {
        transform-origin: 735px 78px;
        animation: pulse-ring 2.6s ease-out infinite;
      }
      @keyframes flow {
        0% {
          stroke-dashoffset: 90;
        }
        100% {
          stroke-dashoffset: -720;
        }
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.7;
        }
        75%, 100% {
          transform: scale(1.75);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line {
          animation: none;
          display: none;
        }
        .pulse-ring {
          animation: none;
          opacity: 0.35;
          transform: scale(1.1);
        }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="219" rx="12" fill="#0D1117" stroke="#21262D" stroke-width="1" />

  <text x="28" y="34" class="sans" font-size="11" font-weight="600" letter-spacing="1.4" fill="#8B949E">TRILHA DE ESTUDOS · EVOLUÇÃO CONTÍNUA</text>

  <line x1="105" y1="78" x2="735" y2="78" stroke="#21262D" stroke-width="2" stroke-linecap="round" />
  <line class="flow-line" x1="105" y1="78" x2="735" y2="78" stroke="url(#flow-grad-pt-dark)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 720" />

  <!-- Node 1: Base Sólida -->
  <circle cx="105" cy="78" r="14" fill="#0D1117" />
  <circle cx="105" cy="78" r="10" fill="#6366F1" />
  <circle cx="105" cy="78" r="3.5" fill="#F0F6FC" />
  <text x="105" y="112" text-anchor="middle" class="sans" font-size="10" font-weight="600" letter-spacing="1" fill="#6E7681">01 · BASE SÓLIDA</text>
  <text x="105" y="133" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F0F6FC">JS &amp; Node.js</text>
  <text x="105" y="151" text-anchor="middle" class="sans" font-size="11.5" fill="#8B949E">HTML5 · CSS · Web</text>
  <rect x="45" y="164" width="120" height="5" rx="2.5" fill="#21262D" />
  <rect x="45" y="164" width="120" height="5" rx="2.5" fill="#6366F1" />
  <text x="105" y="187" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#818CF8">Avançado</text>

  <!-- Node 2: Em Evolução -->
  <circle cx="315" cy="78" r="14" fill="#0D1117" />
  <circle cx="315" cy="78" r="10" fill="#161B22" stroke="#6366F1" stroke-width="2" />
  <circle cx="315" cy="78" r="3.5" fill="#818CF8" />
  <text x="315" y="112" text-anchor="middle" class="sans" font-size="10" font-weight="600" letter-spacing="1" fill="#6E7681">02 · EM EVOLUÇÃO</text>
  <text x="315" y="133" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F0F6FC">React</text>
  <text x="315" y="151" text-anchor="middle" class="sans" font-size="11.5" fill="#8B949E">UI moderna · Hooks</text>
  <rect x="255" y="164" width="120" height="5" rx="2.5" fill="#21262D" />
  <rect x="255" y="164" width="78" height="5" rx="2.5" fill="#6366F1" />
  <text x="315" y="187" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#8B949E">Prática ativa</text>

  <!-- Node 3: Multi-Stack -->
  <circle cx="525" cy="78" r="14" fill="#0D1117" />
  <circle cx="525" cy="78" r="10" fill="#161B22" stroke="#6366F1" stroke-width="2" />
  <circle cx="525" cy="78" r="3.5" fill="#818CF8" />
  <text x="525" y="112" text-anchor="middle" class="sans" font-size="10" font-weight="600" letter-spacing="1" fill="#6E7681">03 · MULTI-STACK</text>
  <text x="525" y="133" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F0F6FC">Java</text>
  <text x="525" y="151" text-anchor="middle" class="sans" font-size="11.5" fill="#8B949E">Spring Boot · API REST</text>
  <rect x="465" y="164" width="120" height="5" rx="2.5" fill="#21262D" />
  <rect x="465" y="164" width="54" height="5" rx="2.5" fill="#6366F1" />
  <text x="525" y="187" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#8B949E">Projeto aplicado</text>

  <!-- Node 4: Foco Atual -->
  <circle cx="735" cy="78" r="14" fill="#0D1117" />
  <circle class="pulse-ring" cx="735" cy="78" r="13" fill="none" stroke="#818CF8" stroke-width="2" />
  <circle cx="735" cy="78" r="10" fill="#6366F1" />
  <circle cx="735" cy="78" r="3.5" fill="#F0F6FC" />
  <text x="735" y="112" text-anchor="middle" class="sans" font-size="10" font-weight="600" letter-spacing="1" fill="#818CF8">04 · FOCO ATUAL</text>
  <text x="735" y="133" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#F0F6FC">IA Agêntica</text>
  <text x="735" y="151" text-anchor="middle" class="sans" font-size="11.5" fill="#8B949E">Agentes · Tool Use</text>
  <rect x="667" y="164" width="136" height="24" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
  <text x="735" y="180" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#A5B4FC">● Estudando agora</text>
</svg>
